  <script>
  /* Only show the loader when arriving from an internal page navigation. */
  (function () {
    try {
      var key = "pho-ngoc-yen-transition";
      var raw = sessionStorage.getItem(key);
      if (!raw) return;
      var transition = JSON.parse(raw);
      if (!transition || transition.to !== location.pathname || Date.now() - transition.at > 6000) {
        sessionStorage.removeItem(key);
        return;
      }
      sessionStorage.removeItem(key);
      document.documentElement.classList.add("pho-loader-entry");
      window.setTimeout(function () {
        document.documentElement.classList.remove("pho-loader-entry");
        var loader = document.querySelector("[data-pho-loader]");
        if (loader) {
          loader.classList.remove("is-active");
          loader.setAttribute("aria-hidden", "true");
        }
        if (document.body) document.body.classList.remove("pho-loader-lock");
      }, 1800);
    } catch (error) {}
  })();
  </script>
